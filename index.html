<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PhysioPrep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Keeping the original session auth script
        const localSession = localStorage.getItem('activeSession');
        const sessionSession = sessionStorage.getItem('activeSession');
        const activeSession = localSession ? JSON.parse(localSession) : (sessionSession ? JSON.parse(sessionSession) : null);
        // if (!activeSession) window.location.replace('login.html'); // Ensure you uncomment if using login
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-900">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <span class="font-bold text-xl text-slate-900 tracking-tight">PhysioPrep</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Available Exams</h1>
            <p class="text-slate-500 mt-1">Select an exam to begin practice.</p>
        </div>
        
        <div id="exam-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading Indicator -->
            <div class="col-span-full text-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('exam-grid');
            
            // This robustly handles fetching from multiple sources
            const files = ['exams.json', 'exam2.json'];
            let allExams = [];
            
            for (const file of files) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    
                    // Unifies both JSON formats: Array (exams.json) & Object (exam2.json)
                    if (Array.isArray(data)) {
                        data.forEach(exam => allExams.push({...exam, sourceFile: file}));
                    } else {
                        allExams.push({...data, sourceFile: file});
                    }
                } catch(e) {
                    console.error("Error fetching", file, e);
                }
            }
            
            grid.innerHTML = '';
            
            if (allExams.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center p-8 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-500">No exams found. Ensure exams.json and exam2.json are properly linked.</div>';
                return;
            }
            
            allExams.forEach(exam => {
                const yearStr = exam.examYear || 'Unknown';
                const titleStr = exam.title || 'Untitled Exam';
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-md transition-shadow cursor-pointer group";
                
                // Passes both the source file and the exam year to quiz.html for dynamic loading
                card.onclick = () => {
                    window.location.href = `quiz.html?file=${exam.sourceFile}&year=${encodeURIComponent(yearStr)}`;
                };
                
                card.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center mt-2">
                        <div class="h-16 w-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-5 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300 shadow-sm">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <h3 class="text-xl font-black text-slate-900 mb-1">${yearStr} Exam</h3>
                        <p class="text-sm text-slate-500 mb-6 font-medium">${titleStr}</p>
                        <div class="w-full flex items-center justify-center py-2.5 px-4 bg-slate-50 text-indigo-700 rounded-xl text-sm font-bold group-hover:bg-indigo-50 transition-colors">
                            Start Exam <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
