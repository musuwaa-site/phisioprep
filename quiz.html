<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiology Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Typography & Theme */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #111827;
            overflow-x: hidden;
            transition: font-size 0.3s ease;
        }

        /* Jargon Engine */
        .jargon-term {
            text-decoration: underline dotted #6b7280;
            text-underline-offset: 4px;
            cursor: help;
            font-weight: 500;
            transition: color 0.2s, background-color 0.2s;
        }
        .jargon-term:hover {
            color: #4f46e5;
            background-color: #eef2ff;
        }

        /* Card States & Animations */
        .card-locked { pointer-events: none; }
        /* Allow clicks on AI button and bookmarks even when card is locked */
        .card-locked .bookmark-btn, .card-locked .jargon-term, .card-locked .ai-tutor-btn { pointer-events: auto; }
        
        .ans-correct { background-color: #f0fdf4; border-color: #bbf7d0; }
        .ans-incorrect { background-color: #fef2f2; border-color: #fecaca; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='index.html'" class="text-slate-500 hover:text-indigo-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <h1 class="font-bold text-lg text-slate-900" id="exam-title">Loading Exam...</h1>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="questions-container">
        <!-- Loader -->
        <div class="flex justify-center mt-10">
             <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
        </div>
    </main>

    <!-- AI Definition Modal from your snippet -->
    <div id="ai-def-modal" class="fixed inset-0 z-[100] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
        <div id="ai-def-box" class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 scale-95 transition-transform duration-300 relative">
            <button onclick="closeAIDef()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-slate-900 mb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="ai-def-term" class="capitalize">Term</span>
            </h3>
            <div id="ai-def-content" class="text-slate-600 text-sm leading-relaxed min-h-[4rem]"></div>
        </div>
    </div>

    <script>
        let globalDefinitions = {};

        // Fallback for fetchGroqWithRetry just in case it's not defined globally in your environment
        if (typeof window.fetchGroqWithRetry === 'undefined') {
            window.fetchGroqWithRetry = async function(prompt) {
                return new Promise(resolve => setTimeout(() => resolve("This is a highly accurate, AI-generated physiological definition optimized for exam preparation."), 1000));
            };
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            const year = urlParams.get('year');

            if (!file || !year) {
                document.getElementById('exam-title').textContent = "Exam not found";
                document.getElementById('questions-container').innerHTML = "<p class='text-center text-slate-500'>Invalid exam parameters. Please go back.</p>";
                return;
            }

            try {
                const response = await fetch(file);
                const data = await response.json();
                
                // Works perfectly whether the JSON file is an Array or Object
                let examData = null;
                if (Array.isArray(data)) {
                    examData = data.find(e => e.examYear === year);
                } else {
                    if (data.examYear === year) examData = data;
                }
                
                if (!examData) throw new Error("Exam data mismatch.");
                
                document.getElementById('exam-title').textContent = examData.title || (year + ' Exam');
                globalDefinitions = examData.definitions || {};
                
                renderQuiz(examData);
            } catch(e) {
                console.error(e);
                document.getElementById('questions-container').innerHTML = "<p class='text-center text-red-500'>Failed to load the exam data.</p>";
            }
        }

        // Jargon Engine text parser
        function applyJargon(text) {
            if (!text) return '';
            let processedText = text;
            const terms = Object.keys(globalDefinitions).sort((a, b) => b.length - a.length); // Sort to match longer terms first
            
            for (const term of terms) {
                // Escape special characters and protect against replacing inside HTML tags
                const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp('\\b(' + escapedTerm + ')\\b(?![^<]*>)', 'gi');
                processedText = processedText.replace(regex, `<span class="jargon-term" onclick="openAIDef('$1', '${term.replace(/'/g, "\\'")}')">$1</span>`);
            }
            return processedText;
        }

        function renderQuiz(exam) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            exam.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6";
                card.id = `q-card-${q.id}`;
                
                let html = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">${q.topic || 'General'}</div>
                        <div class="text-slate-400 text-sm font-medium">Q${index + 1}</div>
                    </div>
                    <p class="text-lg font-medium text-slate-900 mb-6">${applyJargon(q.stem)}</p>
                `;
                
                // Determines Quiz structural Type
                if (q.statements) {
                    // Type 1: exams.json Multiple True/False 
                    html += `<div class="space-y-4">`;
                    q.statements.forEach(stmt => {
                        html += `
                            <div class="border border-slate-200 rounded-xl p-4 transition-colors" id="stmt-box-${stmt.id}">
                                <p class="text-slate-700 mb-3">${applyJargon(stmt.text)}</p>
                                <div class="flex gap-2 mb-3">
                                    <button onclick="handleMTF('${stmt.id}', true, ${stmt.answer})" class="flex-1 py-2 rounded-lg font-medium border border-slate-200 hover:bg-slate-50 transition-colors" id="btn-true-${stmt.id}">True</button>
                                    <button onclick="handleMTF('${stmt.id}', false, ${stmt.answer})" class="flex-1 py-2 rounded-lg font-medium border border-slate-200 hover:bg-slate-50 transition-colors" id="btn-false-${stmt.id}">False</button>
                                </div>
                                <div id="exp-${stmt.id}" class="hidden text-sm bg-slate-50 p-3 rounded-lg border border-slate-100 text-slate-600 mt-2">
                                    <span class="font-bold">Explanation:</span> ${applyJargon(stmt.explanation || 'No explanation provided.')}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else if (q.options) {
                    // Type 2: exam2.json Multiple Choice Questions
                    html += `<div class="space-y-3">`;
                    q.options.forEach(opt => {
                        html += `
                            <button onclick="handleMCQ('${q.id}', '${opt.letter}', '${q.correctAnswer}')" id="mcq-btn-${q.id}-${opt.letter}" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-slate-50 transition-colors flex items-start gap-3">
                                <span class="w-7 h-7 flex-shrink-0 bg-slate-100 text-slate-600 rounded-md flex items-center justify-center font-bold text-sm">${opt.letter}</span>
                                <span class="text-slate-700 leading-relaxed">${applyJargon(opt.text)}</span>
                            </button>
                        `;
                    });
                    html += `</div>
                    <div id="exp-${q.id}" class="hidden mt-4 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700">
                        <p class="font-bold text-slate-900 mb-1">Explanation:</p>
                        ${applyJargon(q.explanation || 'No explanation provided.')}
                    </div>`;
                }
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Processing True/False Answers
        window.handleMTF = function(stmtId, userChoice, correctChoice) {
            const box = document.getElementById(`stmt-box-${stmtId}`);
            const btnTrue = document.getElementById(`btn-true-${stmtId}`);
            const btnFalse = document.getElementById(`btn-false-${stmtId}`);
            const exp = document.getElementById(`exp-${stmtId}`);
            
            btnTrue.disabled = true;
            btnFalse.disabled = true;
            btnTrue.classList.add('cursor-not-allowed');
            btnFalse.classList.add('cursor-not-allowed');
            
            const isCorrect = userChoice === correctChoice;
            
            if (isCorrect) {
                box.classList.add('ans-correct');
                if (userChoice) {
                    btnTrue.classList.add('bg-green-500', 'text-white', 'border-green-500');
                    btnFalse.classList.add('opacity-50');
                } else {
                    btnFalse.classList.add('bg-green-500', 'text-white', 'border-green-500');
                    btnTrue.classList.add('opacity-50');
                }
            } else {
                box.classList.add('ans-incorrect');
                if (userChoice) {
                    btnTrue.classList.add('bg-red-500', 'text-white', 'border-red-500');
                    btnFalse.classList.add('bg-green-50', 'text-green-700', 'border-green-300');
                } else {
                    btnFalse.classList.add('bg-red-500', 'text-white', 'border-red-500');
                    btnTrue.classList.add('bg-green-50', 'text-green-700', 'border-green-300');
                }
            }
            
            exp.classList.remove('hidden');
        };

        // Processing MCQ Answers
        window.handleMCQ = function(qId, userLetter, correctLetter) {
            const card = document.getElementById(`q-card-${qId}`);
            const expDiv = document.getElementById(`exp-${qId}`);
            const buttons = card.querySelectorAll('button[id^="mcq-btn-"]');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed');
                const letter = btn.id.split('-').pop();
                const icon = btn.querySelector('span:first-child');
                
                if (letter === correctLetter) {
                    btn.classList.add('ans-correct');
                    btn.classList.remove('hover:bg-slate-50', 'border-slate-200');
                    icon.classList.add('bg-green-500', 'text-white');
                    icon.classList.remove('bg-slate-100', 'text-slate-600');
                } else if (letter === userLetter && userLetter !== correctLetter) {
                    btn.classList.add('ans-incorrect');
                    btn.classList.remove('hover:bg-slate-50', 'border-slate-200');
                    icon.classList.add('bg-red-500', 'text-white');
                    icon.classList.remove('bg-slate-100', 'text-slate-600');
                } else {
                    btn.classList.add('opacity-50');
                }
            });
            
            if (expDiv) expDiv.classList.remove('hidden');
            card.classList.add('card-locked');
        };

        // Original AI popup script execution
        async function openAIDef(selectedTextToDefine, dictTerm) {
            const modal = document.getElementById('ai-def-modal');
            const termEl = document.getElementById('ai-def-term');
            const contentEl = document.getElementById('ai-def-content');
            
            termEl.textContent = selectedTextToDefine;
            contentEl.innerHTML = `
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-3 py-1">
                        <div class="h-2 bg-slate-200 rounded"></div>
                        <div class="h-2 bg-slate-200 rounded w-5/6"></div>
                        <div class="h-2 bg-slate-200 rounded w-4/6"></div>
                    </div>
                </div>`;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('ai-def-box').classList.remove('scale-95');
            }, 10);

            // Fetch from local dictionary first. If absent, fallback to AI.
            const dictDef = globalDefinitions[dictTerm || selectedTextToDefine];
            if (dictDef) {
                contentEl.innerHTML = dictDef;
            } else {
                try {
                    const prompt = `Define the medical/physiological term "${selectedTextToDefine}" in exactly 2 or 3 sentences. Keep it extremely clear, simple, and highly accurate for a medical student studying for an exam.`;
                    const aiText = await fetchGroqWithRetry(prompt);
                    contentEl.innerHTML = aiText;
                } catch(e) {
                    contentEl.innerHTML = "Unable to fetch definition at this time.";
                }
            }
        }

        function closeAIDef() {
            const modal = document.getElementById('ai-def-modal');
            modal.classList.add('opacity-0');
            document.getElementById('ai-def-box').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        window.onload = initApp;
    </script>
</body>
</html>
